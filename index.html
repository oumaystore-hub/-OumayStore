<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OUMAYSTORE</title>
    
    <!-- إعدادات PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a5f">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="logo.png">

    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {--gold:#c9a96e; --navy:#1e3a5f; --cream:#faf8f5; --dark:#0f172a;}
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body {background: var(--cream); color: var(--dark); overflow-x: hidden; height: 100vh; display: flex; flex-direction: column;}
        
        /* --- شاشة البداية --- */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .logo-text {font-size: 2.5rem; font-weight: 900; color: #fff; margin-bottom: 20px;}
        .logo-text span {color: var(--gold);}
        .lang-btn {
            padding: 12px 30px; margin: 5px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 25px;
            cursor: pointer; font-size: 1rem;
        }

        /* --- واجهة المتجر --- */
        #app-interface {display: none; flex-direction: column; height: 100%;}
        
        header {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100;
        }
        .brand {font-size: 1.4rem; font-weight: 800; color: var(--navy);}
        .brand span {color: var(--gold);}
        .cart-icon {position: relative; font-size: 1.3rem; color: var(--navy); cursor: pointer;}
        .badge {            position: absolute; top: -8px; right: -8px;
            background: var(--gold); color: white; font-size: 0.7rem;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .content-area {flex: 1; overflow-y: auto; padding-bottom: 80px;}
        
        .hero {
            margin: 20px; border-radius: 20px; overflow: hidden; height: 180px;
            background: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800') center/cover;
            position: relative;
        }
        .hero-overlay {
            position: absolute; inset: 0; background: linear-gradient(to right, rgba(30,58,95,0.8), transparent);
            display: flex; align-items: center; padding: 20px;
        }
        .hero h2 {color: white; font-size: 1.6rem;}

        .products-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px;
        }
        .product-card {
            background: white; border-radius: 15px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03); position: relative;
            display: flex; flex-direction: column;
        }
        .p-img {height: 150px; background: #f0f0f0; position: relative;}
        .p-img img {width: 100%; height: 100%; object-fit: cover;}
        .p-details {padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;}
        .p-name {font-size: 0.9rem; font-weight: 700; margin-bottom: 5px;}
        .p-price {color: var(--gold); font-weight: 800;}
        
        .add-btn {
            background: var(--navy); color: white; border: none;
            padding: 8px 15px; border-radius: 20px; font-size: 0.8rem;
            margin-top: 8px; cursor: pointer; width: 100%;
        }
        .add-btn:active {transform: scale(0.95);}

        /* القائمة السفلية */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
            background: white; border-top: 1px solid #eee;
            display: flex; justify-content: space-around; align-items: center; z-index: 90;
        }
        .nav-item {display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 0.75rem;}
        .nav-item i {font-size: 1.3rem; margin-bottom: 4px;}
        .nav-item.active {color: var(--gold);}
        /* السلة */
        .cart-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000;
            display: none; align-items: flex-end;
        }
        .cart-sheet {
            background: white; width: 100%; height: 85vh; border-radius: 25px 25px 0 0;
            padding: 20px; animation: slideUp 0.3s ease; display: flex; flex-direction: column;
        }
        .cart-header {display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem;}
        .cart-items {flex: 1; overflow-y: auto;}
        .cart-item {display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #f5f5f5; padding-bottom: 10px;}
        .cart-item img {width: 60px; height: 60px; border-radius: 10px; object-fit: cover;}
        .checkout-btn {
            background: var(--gold); color: white; border: none; padding: 15px;
            border-radius: 12px; font-weight: bold; font-size: 1.1rem; margin-top: 10px;
        }

        @keyframes slideUp {from{transform:translateY(100%)} to{transform:translateY(0)}}
    </style>
</head>
<body>

    <!-- 1. شاشة البداية -->
    <div id="splash-screen">
        <div class="logo-text">OUMAY<span>STORE</span></div>
        <button class="lang-btn" onclick="startApp()">دخول للمتجر 🇸🇦</button>
    </div>

    <!-- 2. واجهة المتجر -->
    <div id="app-interface">
        <header>
            <div class="brand">OUMAY<span>STORE</span></div>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="badge" id="cart-count">0</span>
            </div>
        </header>

        <div class="content-area">
            <div class="hero">
                <div class="hero-overlay">
                    <h2>أحدث المنتجات</h2>
                </div>
            </div>

            <div style="padding: 0 15px; font-weight: bold; color: var(--navy);">منتجاتنا المميزة</div>
            
            <!-- شبكة المنتجات -->
            <div class="products-grid" id="products-container">                <!-- سيتم ملء المنتجات هنا بالجافا سكريبت -->
            </div>
            
            <!-- رسالة تظهر إذا كان المتجر فارغاً -->
            <div id="empty-msg" style="text-align:center; padding:20px; color:#888; display:none;">
                لا توجد منتجات حالياً. قم بإضافتها من لوحة التحكم.
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></div>
            <div class="nav-item" onclick="alert('قريباً!')"><i class="fa-solid fa-heart"></i><span>المفضلة</span></div>
            <div class="nav-item" onclick="alert('قريباً!')"><i class="fa-solid fa-user"></i><span>حسابي</span></div>
        </div>
    </div>

    <!-- نافذة السلة -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-sheet">
            <div class="cart-header">
                <span>سلة المشتريات</span>
                <span onclick="toggleCart()" style="cursor:pointer"><i class="fa-solid fa-times"></i></span>
            </div>
            <div class="cart-items" id="cart-items-list">
                <!-- عناصر السلة -->
            </div>
            <div class="cart-footer">
                <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:15px;">
                    <span>المجموع:</span>
                    <span id="cart-total">0 MAD</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">إتمام الشراء</button>
            </div>
        </div>
    </div>

    <script>
        // === الربط مع لوحة التحكم ===
        // نستخدم نفس المفاتيح المستخدمة في admin.html
        const STORAGE_KEY = 'oumay_products';
        const CART_KEY = 'oumay_cart';
        const ORDERS_KEY = 'oumay_orders';

        let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];

        // بدء التطبيق
        function startApp() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';                document.getElementById('app-interface').style.display = 'flex';
                loadProducts();
                updateCartUI();
            }, 500);
        }

        // تحميل المنتجات من LocalStorage (التي أضافها الأدمن)
        function loadProducts() {
            const products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const container = document.getElementById('products-container');
            const emptyMsg = document.getElementById('empty-msg');

            container.innerHTML = '';

            if (products.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            } else {
                emptyMsg.style.display = 'none';
            }

            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <div class="p-img">
                            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://placehold.co/300'">
                        </div>
                        <div class="p-details">
                            <div>
                                <div class="p-name">${p.name}</div>
                                <div class="p-price">${p.price} MAD</div>
                            </div>
                            <button class="add-btn" onclick="addToCart(${p.id})">
                                <i class="fa-solid fa-plus"></i> أضف للسلة
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // إضافة للسلة
        function addToCart(id) {
            const products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const product = products.find(p => p.id === id);
            
            if(product) {
                cart.push(product);
                localStorage.setItem(CART_KEY, JSON.stringify(cart));
                updateCartUI();                
                // تأثير بصري للزر
                const btn = event.target;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> تم';
                btn.style.background = '#22c55e';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = 'var(--navy)';
                }, 1000);
            }
        }

        // تحديث واجهة السلة
        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            
            if(cart.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#888; margin-top:50px;">السلة فارغة</p>';
                document.getElementById('cart-total').innerText = '0 MAD';
            } else {
                list.innerHTML = cart.map((item, index) => `
                    <div class="cart-item">
                        <img src="${item.img}" onerror="this.src='https://placehold.co/60'">
                        <div style="flex:1">
                            <div style="font-weight:bold">${item.name}</div>
                            <div style="color:var(--gold)">${item.price} MAD</div>
                        </div>
                        <i class="fa-solid fa-trash" style="color:red; align-self:center; cursor:pointer" onclick="removeFromCart(${index})"></i>
                    </div>
                `).join('');
                
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                document.getElementById('cart-total').innerText = total + " MAD";
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function checkout() {            if(cart.length === 0) return alert('السلة فارغة!');
            
            // حفظ الطلب في لوحة التحكم
            const orders = JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
            const newOrder = {
                id: Date.now(),
                date: new Date().toISOString(),
                items: cart,
                total: cart.reduce((sum, item) => sum + item.price, 0),
                status: 'pending'
            };
            
            orders.push(newOrder);
            localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
            
            // تفريغ السلة
            cart = [];
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateCartUI();
            toggleCart();
            
            alert('✅ تم إرسال طلبك بنجاح! سنتواصل معك قريباً.');
        }
    </script>
</body>
</html>
