<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - OUMAYSTORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1e3a5f; --accent: #c9a96e; --bg: #f8fafc; --white: #ffffff; --text: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* Sidebar */
        .sidebar { 
            width: 260px; background: var(--primary); color: white; padding: 20px; 
            position: fixed; height: 100%; right: 0; top: 0; z-index: 100; transition: 0.3s; 
            display: flex; flex-direction: column;
        }
        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; text-align: center; color: var(--accent); letter-spacing: 1px; white-space: nowrap;}
        .menu-item { 
            padding: 12px 15px; cursor: pointer; border-radius: 10px; margin-bottom: 8px; 
            transition: 0.3s; display: flex; align-items: center; gap: 12px; opacity: 0.8; white-space: nowrap;
        }
        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.1); opacity: 1; color: var(--accent); }
        
        /* Main Content */
        .main-content { margin-right: 260px; flex: 1; padding: 30px; transition: 0.3s; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .card { background: var(--white); padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; overflow: hidden; }
        
        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--primary); }
        .form-input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; background: #f8fafc; transition: 0.3s; }
        .form-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(201,169,110,0.1); }
        
        /* Image Upload Multi */
        .upload-area { border: 2px dashed #cbd5e1; padding: 30px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.3s; background: #fdfdfd; }
        .upload-area:hover { border-color: var(--accent); background: #fffcf5; }
        .preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .preview-box { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid #eee; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .remove-img { position: absolute; top: 2px; right: 2px; background: rgba(239,68,68,0.9); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; }

        /* Colors Input */
        .color-picker-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        input[type="color"] { width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%; cursor: pointer; overflow: hidden; }
        .selected-colors { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; cursor: pointer; }        .color-dot:hover::after { content: '×'; position: absolute; inset: 0; background: rgba(0,0,0,0.5); color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; }

        /* Buttons & Tables */
        .btn { padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 600px; /* لضمان عدم تكسر الجدول */ }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #f1f5f9; }
        th { color: #64748b; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .prod-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        
        /* Login Overlay */
        #login-overlay { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }

        /* Modal for Add Product (Fixed Z-Index) */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            z-index: 10000; /* أعلى من القائمة الجانبية */
            display: none; align-items: center; justify-content: center; 
            backdrop-filter: blur(5px); padding: 20px; 
        }
        .modal-sheet { 
            background: white; width: 100%; max-width: 600px; max-height: 90vh; 
            border-radius: 16px; padding: 25px; overflow-y: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; 
        }
        
        /* Order Details Modal */
        .order-modal-content { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .order-item-row { display: flex; gap: 10px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .order-item-row img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }

        /* --- تحسينات الهاتف (Responsive) --- */
        @media(max-width: 768px) {
            .sidebar { width: 70px; padding: 10px; align-items: center; }
            .sidebar span, .logo span { display: none; } /* إخفاء النصوص */
            .logo { font-size: 1.2rem; margin-bottom: 20px; }
            .main-content { margin-right: 70px; padding: 15px; }
            .menu-item { justify-content: center; padding: 15px 0; }
            .header { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; margin-bottom: 5px; } /* الأزرار بعرض كامل */
            .card { padding: 15px; }
            
            /* إصلاح الجدول على الهاتف */
            .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }    </style>
</head>
<body>

    <!-- تسجيل الدخول -->
    <div id="login-overlay">
        <div class="login-card">
            <h2 style="color:var(--primary); margin-bottom:10px;">OUMAY ADMIN</h2>
            <p style="color:#64748b; margin-bottom:25px;">لوحة إدارة المتجر</p>
            <input type="password" id="pass-input" class="form-input" placeholder="كلمة المرور: 1234" style="margin-bottom:15px;">
            <button onclick="login()" class="btn btn-primary" style="width:100%">دخول آمن</button>
            <p id="login-err" style="color:red; margin-top:10px; display:none;">كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="logo">OUMAY<span>STORE</span></div>
        <div class="menu-item active" onclick="switchTab('products')"><i class="fa-solid fa-box-open"></i> <span>المنتجات</span></div>
        <div class="menu-item" onclick="switchTab('orders')"><i class="fa-solid fa-truck-fast"></i> <span>الطلبات</span></div>
        <div class="menu-item" onclick="window.open('index.html', '_blank')"><i class="fa-solid fa-store"></i> <span>عرض المتجر</span></div>
        <div class="menu-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> <span>خروج</span></div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        
        <!-- قسم المنتجات -->
        <div id="tab-products">
            <div class="header">
                <h2 style="color:var(--primary)">📦 إدارة المنتجات</h2>
                <button onclick="openModal()" class="btn btn-accent"><i class="fa-solid fa-plus"></i> إضافة منتج</button>
            </div>
            
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>صورة</th>
                                <th>الاسم</th>
                                <th>السعر</th>
                                <th>الألوان</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="prod-list"></tbody>
                    </table>
                </div>
            </div>        </div>

        <!-- قسم الطلبات -->
        <div id="tab-orders" style="display:none;">
            <div class="header">
                <h2 style="color:var(--primary)">🛒 الطلبات الواردة</h2>
                <button onclick="clearOrders()" class="btn btn-danger">حذف الكل</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>رقم الطلب</th>
                                <th>معلومات العميل</th>
                                <th>المبلغ الإجمالي</th>
                                <th>التفاصيل</th>
                            </tr>
                        </thead>
                        <tbody id="order-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة منتج -->
    <div id="modal" class="modal-overlay">
        <div class="modal-sheet">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; align-items:center;">
                <h3 style="color:var(--primary)">بيانات المنتج الجديد</h3>
                <button onclick="closeModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888;">✕</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">اسم المنتج</label>
                <input type="text" id="p-name" class="form-input">
            </div>

            <div class="form-group" style="display:flex; gap:15px; flex-wrap:wrap;">
                <div style="flex:1; min-width:120px;">
                    <label class="form-label">السعر (MAD)</label>
                    <input type="number" id="p-price" class="form-input">
                </div>
                <div style="flex:1; min-width:120px;">
                    <label class="form-label">التصنيف</label>
                    <select id="p-cat" class="form-input">
                        <option value="ملابس">ملابس</option>
                        <option value="أحذية">أحذية</option>
                        <option value="إكسسوارات">إكسسوارات</option>                        <option value="منزل">منزل وديكور</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">صور المنتج (يمكنك اختيار أكثر من صورة)</label>
                <div class="upload-area" onclick="document.getElementById('p-files').click()">
                    <i class="fa-solid fa-images" style="font-size:24px; color:var(--accent); margin-bottom:10px;"></i>
                    <p>اضغط هنا لرفع الصور من الهاتف</p>
                </div>
                <input type="file" id="p-files" multiple accept="image/*" style="display:none" onchange="handleFiles(this)">
                <div id="preview-container" class="preview-container"></div>
            </div>

            <div class="form-group">
                <label class="form-label">الألوان المتاحة</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="color-picker" value="#1e3a5f">
                    <button onclick="addColor()" class="btn btn-primary" style="padding:8px 15px; font-size:0.8rem;">+ إضافة لون</button>
                </div>
                <div id="selected-colors" class="selected-colors"></div>
            </div>

            <div class="form-group">
                <label class="form-label">وصف المنتج</label>
                <textarea id="p-desc" class="form-input" rows="3"></textarea>
            </div>

            <div style="display:flex; gap:10px; margin-top:25px; flex-wrap:wrap;">
                <button onclick="saveProduct()" class="btn btn-accent" style="flex:1; justify-content:center;">حفظ ونشر</button>
                <button onclick="closeModal()" class="btn btn-danger" style="flex:1; justify-content:center;">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة تفاصيل الطلب -->
    <div id="order-modal" class="modal-overlay">
        <div class="modal-sheet">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
                <h3 style="color:var(--primary)">تفاصيل الطلب</h3>
                <button onclick="closeOrderModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888;">✕</button>
            </div>
            <div id="order-details-content"></div>
        </div>
    </div>

    <script>
        // === استخدام نفس المفاتيح الموجودة في index.html ===
        const KEY_PRODUCTS = 'oumay_products_v2';        const KEY_ORDERS = 'oumay_orders_v2';
        
        let products = JSON.parse(localStorage.getItem(KEY_PRODUCTS)) || [];
        let orders = JSON.parse(localStorage.getItem(KEY_ORDERS)) || [];
        
        let currentImages = [];
        let currentColors = [];

        // --- نظام الدخول ---
        function login() {
            if(document.getElementById('pass-input').value === "1234") {
                localStorage.setItem('admin_auth', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                init();
            } else {
                document.getElementById('login-err').style.display = 'block';
            }
        }
        if(localStorage.getItem('admin_auth') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            init();
        }
        function logout() { localStorage.removeItem('admin_auth'); location.reload(); }

        function init() { renderProducts(); renderOrders(); }

        // --- إدارة الصور المتعددة ---
        function handleFiles(input) {
            if (input.files) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        currentImages.push(e.target.result);
                        renderPreviews();
                    };
                    reader.readAsDataURL(file);
                });
            }
        }
        function renderPreviews() {
            const container = document.getElementById('preview-container');
            container.innerHTML = '';
            currentImages.forEach((img, idx) => {
                container.innerHTML += `
                    <div class="preview-box">
                        <img src="${img}">
                        <div class="remove-img" onclick="removeImage(${idx})">✕</div>
                    </div>`;
            });
        }        function removeImage(idx) {
            currentImages.splice(idx, 1);
            renderPreviews();
        }

        // --- إدارة الألوان ---
        function addColor() {
            const color = document.getElementById('color-picker').value;
            if(!currentColors.includes(color)) {
                currentColors.push(color);
                renderColors();
            }
        }
        function renderColors() {
            const container = document.getElementById('selected-colors');
            container.innerHTML = '';
            currentColors.forEach((c, idx) => {
                container.innerHTML += `<div class="color-dot" style="background:${c}" onclick="removeColor(${idx})"></div>`;
            });
        }
        function removeColor(idx) {
            currentColors.splice(idx, 1);
            renderColors();
        }

        // --- حفظ وعرض المنتجات ---
        function saveProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const cat = document.getElementById('p-cat').value;
            const desc = document.getElementById('p-desc').value;

            if(!name || !price) return alert('الاسم والسعر مطلوبان');

            const product = {
                id: Date.now(),
                name, price: parseInt(price), cat, desc,
                images: currentImages.length ? currentImages : ['https://placehold.co/400'],
                colors: currentColors
            };

            products.push(product);
            localStorage.setItem(KEY_PRODUCTS, JSON.stringify(products));
            closeModal();
            renderProducts();
            alert('تم نشر المنتج بنجاح! سيظهر الآن في المتجر.');
        }

        function renderProducts() {
            const list = document.getElementById('prod-list');            list.innerHTML = '';
            products.forEach((p, i) => {
                const colorsHtml = p.colors.map(c => `<span style="display:inline-block;width:15px;height:15px;background:${c};border-radius:50%;margin-left:3px;border:1px solid #ddd;"></span>`).join('');
                
                list.innerHTML += `
                    <tr>
                        <td><img src="${p.images[0]}" class="prod-thumb"></td>
                        <td><strong>${p.name}</strong><br><small style="color:#888">${p.cat}</small></td>
                        <td>${p.price} MAD</td>
                        <td>${colorsHtml}</td>
                        <td><button onclick="deleteProd(${i})" class="btn btn-danger" style="padding:5px 10px; font-size:0.8rem;">حذف</button></td>
                    </tr>`;
            });
        }
        function deleteProd(i) {
            if(confirm('حذف المنتج؟')) {
                products.splice(i, 1);
                localStorage.setItem(KEY_PRODUCTS, JSON.stringify(products));
                renderProducts();
            }
        }

        // --- إدارة الطلبات ---
        function renderOrders() {
            const list = document.getElementById('order-list');
            list.innerHTML = '';
            if(!orders.length) return list.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px">لا توجد طلبات</td></tr>';
            
            orders.forEach(o => {
                list.innerHTML += `
                    <tr>
                        <td>#${o.id.toString().slice(-4)}</td>
                        <td>
                            <div style="font-weight:bold">${o.customerName}</div>
                            <div style="font-size:0.85rem;color:#64748b">${o.phone}</div>
                        </td>
                        <td style="color:var(--accent);font-weight:bold">${o.total} MAD</td>
                        <td>
                            <button onclick="viewOrderDetails(${o.id})" class="btn btn-primary" style="padding:5px 10px; font-size:0.8rem;">
                                <i class="fa-solid fa-eye"></i> عرض
                            </button>
                        </td>
                    </tr>`;
            });
        }

        function viewOrderDetails(id) {
            const order = orders.find(o => o.id === id);
            if(!order) return;
            const content = document.getElementById('order-details-content');
            content.innerHTML = `
                <div class="order-modal-content">
                    <p><strong>العميل:</strong> ${order.customerName}</p>
                    <p><strong>الهاتف:</strong> ${order.phone}</p>
                    <p><strong>العنوان:</strong> ${order.address || 'غير محدد'}</p>
                    <p><strong>التاريخ:</strong> ${new Date(order.date).toLocaleDateString('ar-MA')}</p>
                </div>
                <h4 style="margin-bottom:10px;">المنتجات:</h4>
                ${order.items.map(item => `
                    <div class="order-item-row">
                        <img src="${item.images[0]}" onerror="this.src='https://placehold.co/50'">
                        <div>
                            <div style="font-weight:bold">${item.name}</div>
                            <div style="font-size:0.85rem; color:#666">${item.selectedColor ? 'لون: '+item.selectedColor : ''}</div>
                            <div style="color:var(--accent)">${item.price} MAD</div>
                        </div>
                    </div>
                `).join('')}
                <div style="margin-top:15px; text-align:left; font-weight:bold; font-size:1.2rem;">
                    المجموع: ${order.total} MAD
                </div>
            `;
            document.getElementById('order-modal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('order-modal').style.display = 'none';
        }

        function clearOrders() {
            if(confirm('حذف كل الطلبات؟')) {
                orders = [];
                localStorage.setItem(KEY_ORDERS, JSON.stringify(orders));
                renderOrders();
            }
        }

        // --- واجهة ---
        function switchTab(tab) {
            document.getElementById('tab-products').style.display = tab==='products'?'block':'none';
            document.getElementById('tab-orders').style.display = tab==='orders'?'block':'none';
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        function openModal() {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-desc').value = '';            currentImages = []; currentColors = [];
            renderPreviews(); renderColors();
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
